<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>I'm Sorry 🧸</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow:hidden;background:radial-gradient(circle at 50% 20%,#38204f,#130e25 45%,#070711);color:#fff}
.scene{height:100vh;display:grid;place-items:center;perspective:1200px;position:relative;overflow:hidden}
.stars,.hearts{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.7;animation:twinkle 2.8s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.4)}}
.card{position:relative;width:min(92vw,430px);min-height:650px;padding:32px 22px 24px;border:1px solid rgba(255,255,255,.2);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.18);transform-style:preserve-3d;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotateX(1deg) rotateY(-1deg)}}
h1{margin:0;text-align:center;font-size:34px;letter-spacing:.5px;text-shadow:0 8px 30px #000}
.sub{text-align:center;color:#e9dff2;margin:7px 0 20px;font-size:14px}
.teddy-wrap{height:310px;display:grid;place-items:center;position:relative;transform:translateZ(50px)}
.teddy{width:190px;height:190px;background:linear-gradient(145deg,#d99a62,#9b5d38);border-radius:48% 48% 44% 44%;position:relative;box-shadow:inset -18px -15px 25px rgba(55,25,10,.25),0 25px 45px rgba(0,0,0,.35);animation:teddyFloat 3.5s ease-in-out infinite}
@keyframes teddyFloat{50%{transform:translateY(-13px) rotate(-1deg)}}
.ear{position:absolute;width:67px;height:67px;background:#b87549;border-radius:50%;top:-25px;box-shadow:inset 0 0 0 14px #d99a62}.ear.l{left:4px}.ear.r{right:4px}
.eye{position:absolute;width:13px;height:18px;background:#171016;border-radius:50%;top:73px}.eye.l{left:55px}.eye.r{right:55px}
.eye:after{content:"";position:absolute;width:4px;height:4px;background:white;border-radius:50%;top:3px;left:3px}
.muzzle{position:absolute;width:78px;height:62px;background:#e5b17c;border-radius:50%;left:56px;top:90px}
.nose{position:absolute;width:25px;height:17px;background:#382019;border-radius:50%;left:26px;top:13px}
.mouth{position:absolute;width:31px;height:18px;border-bottom:4px solid #4b241d;border-radius:0 0 50% 50%;left:23px;top:27px}
.arm{position:absolute;width:72px;height:32px;background:#b87549;border-radius:30px;top:112px}.arm.l{left:-40px;transform:rotate(25deg)}.arm.r{right:-40px;transform:rotate(-25deg)}
.heart{position:absolute;left:72px;top:17px;font-size:42px;filter:drop-shadow(0 5px 12px #ff5f8a);animation:heart 1.4s infinite}
@keyframes heart{50%{transform:scale(1.12)}}
.speech{position:absolute;right:-10px;top:-25px;background:#fff;color:#321a2e;border-radius:20px 20px 4px 20px;padding:12px 15px;font-weight:800;box-shadow:0 12px 25px #0005;animation:bubble 2.5s infinite}
@keyframes bubble{50%{transform:translateY(-7px)}}
.message{font-size:18px;line-height:1.55;text-align:center;color:#fff;min-height:82px}
.message b{color:#ffb6d0}
.buttons{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:12px 18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff5c91,#9e55ff);box-shadow:0 10px 25px #0005;cursor:pointer}
button.secondary{background:rgba(255,255,255,.1);border:1px solid #ffffff2b}
.note{margin-top:16px;text-align:center;color:#cfc2d7;font-size:12px}
.tear{position:absolute;width:7px;height:15px;background:#9ddcff;border-radius:50%;left:59px;top:94px;opacity:0;animation:cry 4s infinite}
@keyframes cry{0%,55%{opacity:0;transform:translateY(0)}65%{opacity:1}90%{opacity:.7;transform:translateY(30px)}100%{opacity:0}}
.burst{position:fixed;pointer-events:none;font-size:22px;animation:burst 1.5s forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="scene">
  <div class="stars" id="stars"></div>
  <div class="card" id="card">
    <h1>I'm Sorry 🥺</h1>
    <div class="sub">For someone very special in my life…</div>
    <div class="teddy-wrap">
      <div class="speech" id="speech">Pesalama? 🥺</div>
      <div class="teddy">
        <div class="ear l"></div><div class="ear r"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="tear"></div>
        <div class="muzzle"><div class="nose"></div><div class="mouth"></div></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="heart">❤️</div>
      </div>
    </div>
    <div class="message" id="message">
      <b>Un kooda sanda venam…</b><br>
      Naan un smile-a miss panren. 😭<br>
      Konjam kovatha vittutu… <b>thirumbi pesu.</b> 🫂
    </div>
    <div class="buttons">
      <button onclick="sorry()">🧸 Sorry sollava?</button>
      <button class="secondary" onclick="love()">❤️ Smile pannalama?</button>
    </div>
    <div class="note">Tap the buttons… teddy has something to say ✨</div>
  </div>
</div>
<script>
const starBox=document.getElementById('stars');
for(let i=0;i<70;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';starBox.appendChild(s)}
const msg=document.getElementById('message'), speech=document.getElementById('speech');
function burst(chars){
  for(let i=0;i<18;i++){let e=document.createElement('div');e.className='burst';e.textContent=chars[Math.floor(Math.random()*chars.length)];e.style.left='50%';e.style.top='50%';e.style.setProperty('--x',(Math.random()*360-180)+'px');e.style.setProperty('--y',(Math.random()*400-200)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
}
function sorry(){speech.textContent='Please pesu… 🥺';msg.innerHTML='<b>Sorry da… ❤️</b><br>Naan un kooda sanda pottadhu romba miss panren.<br>Un smile thirumbi paakanum. 🫂';burst(['❤️','🫂','✨','🥺'])}
function love(){speech.textContent='Smile plzz! 🥹';msg.innerHTML='<b>Oru chinna smile podu…</b><br>Adhu dhaan enakku romba pidikkum. 🧸❤️<br><small>Miss you more than words can say.</small>';burst(['💖','✨','🧸','🌸'])}
let startX=0;
document.getElementById('card').addEventListener('touchstart',e=>startX=e.touches[0].clientX);
document.getElementById('card').addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-startX;document.getElementById('card').style.transform=`rotateY(${dx/16}deg) rotateX(${-dx/30}deg)`});
document.getElementById('card').addEventListener('touchend',()=>document.getElementById('card').style.transform='');
</script>
</body>
</html>
